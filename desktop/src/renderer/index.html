<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spider XHS Desktop</title>
    <meta name="description" content="Spider XHS Electron desktop client" />
  </head>
  <body>
    <script>
      (function () {
        try {
          var key = 'spider-xhs-theme-preference'
          var preference = localStorage.getItem(key) || 'system'
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var isDark = preference === 'dark' || (preference === 'system' && prefersDark)
          if (isDark) {
            document.body.setAttribute('theme-mode', 'dark')
          } else {
            document.body.removeAttribute('theme-mode')
          }
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'
        } catch (error) {
          document.documentElement.style.colorScheme = 'light'
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
